Policy reference: MH-GC-2027-1048
Effective period: January 01, 2027 – December 31, 2027
Prepared for: Northstar Services (demonstration only)

## 01. Coverage overview
This agreement establishes a group medical benefits framework for eligible employees and dependents. The plan includes outpatient consultations, hospitalization, emergency care and selected preventive services. Benefits are subject to the plan schedule and applicable exclusions.
The annual aggregate benefit ceiling is INR 500,000 per enrolled family. Network hospital treatment may be handled through cashless authorization, while non-network care is reviewed for reimbursement.

## 02. Eligibility and enrollment
Employees actively working at least 30 hours per week are eligible for coverage. Spouses and dependent children up to age 25 may be enrolled when supporting records are provided. Enrollment must be completed within 30 calendar days of joining the organization.
Changes resulting from marriage, birth or qualifying loss of other coverage should be reported within 30 days. Late enrollment requests require review and may be subject to waiting periods.

## 03. Benefits and limits
Inpatient hospitalization is covered up to the available annual family limit, subject to medical necessity and policy conditions. Emergency transport is covered up to INR 8,000 per event. Outpatient diagnostics are covered up to INR 25,000 per family per policy year.
Certain procedures require preauthorization. Room category restrictions and procedure-level sublimits, where applicable, are defined in the benefit schedule. No benefit amount in this document should be interpreted outside its specified conditions.

## 04. Claims and reimbursements
Network hospitals should initiate preauthorization before planned admissions. For emergency admissions, notification should be submitted as soon as practicable, ordinarily within 24 hours. Reimbursement claims must include itemized invoices, discharge summaries, prescriptions and supporting diagnostic records.
Complete reimbursement claims should be submitted within 60 calendar days after discharge. Incomplete claims may be placed on hold until documentation is received. Appeals must be made within 30 days of the adverse determination.

## 05. Exclusions and exceptions
Non-medically necessary procedures, purely cosmetic treatments, experimental therapies and services specifically excluded in the benefit schedule are not covered. Pre-existing condition treatment may be subject to the waiting periods stated in the plan schedule.
Exceptions are considered only when explicitly endorsed in writing. Verbal representations do not amend the policy. Any ambiguity is resolved by reference to the executed contract and incorporated schedules.

## 06. Data protection and confidentiality
Personal and health-related information must be used only for approved eligibility, claims and service operations. Access is limited to authorized personnel with a legitimate need. Transfers to service providers must be governed by appropriate contractual safeguards.
Security incidents affecting protected records should be escalated promptly through the designated incident response process. The parties will cooperate on legally required notifications and remediation.

## 07. Renewal and termination
The agreement expires on December 31, 2027 unless renewed in writing. Renewal terms, pricing and benefits are subject to mutual written agreement. Either party may terminate for material breach following written notice and an opportunity to remedy as specified in the executed agreement.
On termination, outstanding valid claims remain subject to the contract terms applicable at the date of service. Records are retained or securely disposed of in accordance with applicable retention requirements.`;

function chunkify(text){let source=String(text||'').replace(/\r\n/g,'\n').trim();if(!source)return [];const lines=source.split('\n');const sections=[];let current={title:'Overview',content:[]};let autoNum=0;const push=()=>{if(current.content.join('\n').trim()){sections.push({title:current.title,body:current.content.join('\n').trim()})}};for(const l of lines){const t=l.trim();const m=t.match(/^#{1,4}\s+(.+)$/)||t.match(/^((?:section|chapter|article|part)\s+\w+[.:]?\s+.+)$/i)||t.match(/^(\d{1,2}[.)]\s+[A-Za-z][^\n]{3,95})$/);if(m){push();current={title:m[1].trim(),content:[]}}else current.content.push(l)}push();if(sections.length===0)sections.push({title:'Document overview',body:source});const final=[];for(const sec of sections){if(sec.body.length<=1550){final.push(sec);continue}let buffer='',part=0;const groups=sec.body.split(/\n\s*\n/).filter(Boolean);for(const p of groups){if(buffer&&buffer.length+p.length>1150){final.push({title:part?`${sec.title} · continued ${part+1}`:sec.title,body:buffer.trim()});part++;buffer=''}if(p.length>1550){const sentences=p.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[p];for(const sentence of sentences){if(buffer&&buffer.length+sentence.length>1100){final.push({title:part?`${sec.title} · continued ${part+1}`:sec.title,body:buffer.trim()});part++;buffer=''}buffer+=sentence.trim()+' '}}else buffer+=p+'\n\n'}if(buffer.trim())final.push({title:part?`${sec.title} · continued ${part+1}`:sec.title,body:buffer.trim()})}

function enrich(list){return list.map((c,i)=>{const normalized=c.body.replace(/\s+/g,' ').replace(/\s*\|\s*/g,' · ').trim();const sentences=(normalized.match(/[^.!?]+(?:[.!?]+|$)/g)||[]).map(x=>x.trim()).filter(x=>x.length>=24&&x.length<460);const important=sentences.map((s,j)=>({s,j,score:((/\b(must|within|limit|require|covered|eligible|maximum|exclusion|terminate|expires?|only|at least|should|not covered|renew|before|after|days?|hours?|\d[\d,.]*%?|INR|USD|\$)\b/i.test(s))?3:0)+(s.length<205?2:0)+(j===0?1:0)})).sort((a,b)=>b.score-a.score||a.j-b.j).slice(0,3).sort((a,b)=>a.j-b.j);const shorten=(s,max=170)=>s.length>max?s.slice(0,max-1).replace(/\s+\S*$/,'')+'…':s;let highlights=important.map(x=>shorten(x.s)).filter(Boolean);let short=highlights.slice(0,2).join(' ').slice(0,300)||shorten(normalized,260);const metadata=['Policy reference','Effective period','Prepared for'].map(k=>({k,v:c.body.match(new RegExp('^'+k+':\\s*(.+)$','im'))?.[1]})).filter(x=>x.v);if(metadata.length>=2){highlights=metadata.map(x=>x.k+': '+x.v);short='Document snapshot — '+c.title+'. '+metadata.map(x=>x.k+': '+x.v).join(' · ')}else if(/^Table:/i.test(c.title)||/^Sheet:/i.test(c.title)){const rows=c.body.split('\n').filter(x=>x.trim());const headings=(rows[0]||'').split('|').map(x=>x.trim()).filter(Boolean);short=`Structured dataset with ${Math.max(0,rows.length-1)} records${headings.length?', covering '+headings.slice(0,5).join(', '):''}.`;highlights=[`${rows.length} rows including headings`,headings.length?'Fields: '+headings.join(' · '):'Open the original to inspect the complete data'];}else if(/^Slide \d+/i.test(c.title)){const lines=c.body.split('\n').map(x=>x.trim()).filter(Boolean);short='This slide covers '+lines.slice(0,4).join(' · ').slice(0,260)+'.';highlights=lines.slice(0,3)}const words=c.body.trim()?c.body.trim().split(/\s+/).length:0;return {...c,id:`c${i+1}`,summary:short,words,points:highlights.slice(0,3),method:'Key statements summarised from document text'};})}

const FORMAT_ORDER=['pdf','docx','xlsx','pptx','png','txt','md','csv','json','html','xml'];
function rootOf(doc){let d=doc,seen=new Set();while(d&&d.parentId&&!seen.has(d.parentId)){seen.add(d.id);const p=docs.find(x=>x.id===d.parentId);if(!p)break;d=p}return d||doc}
function versionsOf(root){return docs.filter(d=>rootOf(d)?.id===root.id).sort((a,b)=>(a.versionIndex??(a.parentId?9999:1))-(b.versionIndex??(b.parentId?9999:1))||new Date(a.createdAt)-new Date(b.createdAt)||a.id.localeCompare(b.id))}
function versionNumber(doc){const v=versionsOf(rootOf(doc));return Math.max(1,v.findIndex(d=>d.id===doc.id)+1)}
function folders(){return docs.filter(d=>!d.parentId||!docs.some(x=>x.id===d.parentId)).map(root=>({root,versions:versionsOf(root)})).sort((a,b)=>new Date(b.versions.at(-1)?.createdAt)-new Date(a.versions.at(-1)?.createdAt))}
function folderName(root){return root.name.replace(/\.[^.]+$/,'').replace(/_/g,' ')}
function openFolder(docId){const d=docs.find(x=>x.id===docId);if(!d)return;folderId=rootOf(d).id;view='folder';render();window.scrollTo(0,0)}
function binaryFromFixture(x){const bin=atob(x.data),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new Blob([bytes],{type:x.type})}
async function showcaseFile(key){const fx=SHOWCASE[key];if(!fx)return;const existing=docs.find(x=>x.showcaseKey===key);if(existing)return setView('workspace',existing.id);const obj={id:id(),name:fx.name,type:fx.type,versionIndex:1,bytes:fx.size,createdAt:new Date().toISOString(),text:fx.text,html:fx.html,fileBlob:binaryFromFixture(fx),status:fx.status,parentId:null,demo:true,showcaseKey:key};docs.unshift(obj);await dbPut(obj);setView('workspace',obj.id);notify(`${fx.name} opened as a new document folder.`)}
function sampleDerived(parent,n){const source=parent.text.replace('within 60 calendar days','within '+(n===2?'45':'40')+' calendar days').replace('INR 8,000','INR '+(n===2?'9,000':'10,000'));const content=plainHtml(source),filename='Meridian · Group Coverage Agreement · v'+n+'.html',output=htmlDownload(content,filename);return {id:'demo_meridian_v'+n,name:filename,type:'text/html',versionIndex:n,bytes:new Blob([output]).size,createdAt:new Date('2026-11-'+String(7+n).padStart(2,'0')+'T08:00:00Z').toISOString(),text:source,html:content,fileBlob:new Blob([output],{type:'text/html'}),status:'Saved draft · not verified',parentId:parent.id,demo:true}}
function formatStrip(){return `<section class="format-section"><div class="format-heading"><div><div class="kicker">FORMAT PLAYGROUND</div><h2>One canvas. Many formats.</h2><p>Open a real synthetic sample in any format to explore source, meaningful chunks and a working copy.</p></div><span class="format-legend">${icon('shield',14)} Originals are preserved</span></div><div class="format-list">${FORMAT_ORDER.map(k=>`<button class="format-tile" data-act="load-format" data-format-name="${k}" title="Open a sample ${k.toUpperCase()}"><span class="format-symbol">${k.toUpperCase()}</span><span class="format-caption">${k==='pdf'||k==='png'?'Native preview':(['docx','xlsx','pptx'].includes(k)?'Extracted preview':'Text preview')}</span>${icon('arrow',14)}</button>`).join('')}</div><div class="format-disclaimer">Browser demo: DOCX, XLSX and PPTX are displayed as extracted content, not pixel-perfect native rendering; some live uploads need internet for parser libraries. OCR and verified native editing require backend services.</div></section>`}

function id(){return 'doc_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function initDB(){return new Promise((resolve)=>{if(!('indexedDB'in window))return resolve(null);try{const req=indexedDB.open('scanin-channel360-concept-v1',1);req.onupgradeneeded=()=>{req.result.createObjectStore('documents',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>resolve(null)}catch{resolve(null)}})}
function dbGetAll(){return new Promise(resolve=>{if(!db)return resolve([]);const r=db.transaction('documents','readonly').objectStore('documents').getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>resolve([])})}
function dbPut(doc){return new Promise(resolve=>{if(!db)return resolve();const r=db.transaction('documents','readwrite').objectStore('documents').put(doc);r.onsuccess=()=>resolve();r.onerror=()=>resolve()})}
function dbDelete(key){return new Promise(resolve=>{if(!db)return resolve();const r=db.transaction('documents','readwrite').objectStore('documents').delete(key);r.onsuccess=()=>resolve();r.onerror=()=>resolve()})}
function demoDoc(){return {id:'demo_meridian_2027',name:'Meridian · Group Coverage Agreement.md',type:'text/markdown',versionIndex:1,bytes:new Blob([SAMPLE]).size,createdAt:new Date('2026-11-08T08:00:00Z').toISOString(),text:SAMPLE,html:plainHtml(SAMPLE),fileBlob:new Blob([SAMPLE],{type:'text/markdown'}),status:'Parsed',demo:true,parentId:null}}

async function init(){db=await initDB();docs=await dbGetAll();let original=docs.find(d=>d.id==='demo_meridian_2027');if(!original){original=demoDoc();docs.push(original);await dbPut(original)}if(!docs.some(d=>d.id==='demo_meridian_v2')){const v2=sampleDerived(original,2);docs.push(v2);await dbPut(v2)}if(!docs.some(d=>d.id==='demo_meridian_v3')){const parent=docs.find(d=>d.id==='demo_meridian_v2');const v3=sampleDerived(parent,3);docs.push(v3);await dbPut(v3)}activeId=original.id;setView('home');$('file-input').addEventListener('change',async e=>{const f=Array.from(e.target.files||[]);e.target.value='';if(f.length)await ingest(f)})}

function home(){return `<main class="main"><section class="hero"><div class="hero-copy"><div class="kicker">A more meaningful way to work with documents</div><h1>Don't just open it.<br><em>Understand it.</em></h1><p>From a single upload to a complete understanding of your document. Read the source, explore intelligent sections, and make edits—without ever losing what came before.</p><button class="btn dark" data-act="browse">${icon('upload',18)} Scan in a document ${icon('arrow',17)}</button><div class="hero-features"><span><b class="dot-tick">✓</b> One workspace</span><span><b class="dot-tick">✓</b> Original stays untouched</span><span><b class="dot-tick">✓</b> Traceable history</span></div></div><div class="drop-card"><div class="drop-inner" id="dropzone" role="button" tabindex="0" aria-label="Upload documents. Drag and drop or press Enter to browse."><div class="upload-icon">${icon('file',37)}</div><div class="kicker" style="justify-content:center;letter-spacing:.13em;margin-bottom:12px">Start with a document</div><h3>Drop your file here</h3><p>Watch it become a navigable document map with its source, sections and editable working copy.</p><button type="button" class="btn orange">${icon('upload',16)} Choose files</button><small>PDF · Word · Excel · PowerPoint · Images · Text · Data</small></div></div></section><section class="flow-section"><div class="flow-heading"><div><div class="kicker">One document / Three perspectives</div><h2>Everything you need, nothing you don't.</h2></div><p>A document isn't a list of actions. It's one connected reading experience—across source, meaning and change.</p></div><div class="flows"><article class="flow-card"><span class="flow-no">01 / Preserve</span><span class="flow-arrow">↗</span><h3>Original</h3><p>Your immutable point of reference. No silent overwrites, no lost source.</p></article><article class="flow-card"><span class="flow-no">02 / Navigate</span><span class="flow-arrow">↗</span><h3>Chunks</h3><p>An index-first reading map, or meaningful sections when no index exists.</p></article><article class="flow-card"><span class="flow-no">03 / Transform</span><span class="flow-arrow">↗</span><h3>Edits</h3><p>Work on a separate copy, then save a linked derived document.</p></article></div></section>${formatStrip()}<div class="recent-row"><div class="kicker">Pick up where you left off</div>${recent()}<button class="btn muted small" data-act="history">All documents ${icon('arrow',13)}</button></div>${footer()}</main>`}
function workspace(){const d=active();if(!d)return home();const root=rootOf(d),family=versionsOf(root),cs=sections();selectedChunk=Math.min(selectedChunk,Math.max(0,cs.length-1));return `<main class="main workspace-shell"><div class="crumb"><button data-act="home">Scan In</button><span>/</span><button data-act="history">History</button><span>/</span><button data-act="folder" data-id="${esc(root.id)}">${esc(folderName(root))}</button><span>/</span><strong>v${versionNumber(d)}</strong></div>${d.demo?`<div class="sample-ribbon"><span><b>SYNTHETIC SAMPLE</b> · This document is demonstration data. Try the real source download and version controls.</span><button class="btn outline small" data-act="browse">Upload your own</button></div>`:''}<div class="workspace-head"><div class="file-main"><div class="file-mark">${esc(typeLabel(d.name))}</div><div><h2>${esc(d.name)}</h2><div class="file-meta">${humanDate(d.createdAt)} · ${size(d.bytes)} · <strong>${esc(d.status||'Parsed')}</strong> · Version ${versionNumber(d)} of ${family.length}</div><div class="source-identity">${icon('shield',13)} Original: <strong>${esc(root.name)}</strong> · preserved as uploaded</div></div></div><div class="workspace-buttons"><button class="btn outline small" data-act="tab" data-tab="original">${icon('file',15)} View original</button><button class="btn outline small" data-act="download-source">${icon('download',15)} Exact source</button><button class="btn dark small" data-act="browse">${icon('upload',15)} New Scan</button></div></div><div class="version-bar"><div class="version-label">${icon('layers',16)} <span>DOCUMENT FOLDER</span> <strong>${esc(folderName(root))}</strong></div><div class="version-pills">${family.map(v=>`<button class="version-pill ${v.id===d.id?'active':''}" data-act="open" data-id="${esc(v.id)}" title="${esc(v.name)}">v${versionNumber(v)} ${!v.parentId?'· Source':''}</button>`).join('')}</div><button class="version-open" data-act="folder" data-id="${esc(root.id)}">All versions ${icon('arrow',14)}</button></div><div class="three-col"><aside class="panel map-panel"><div class="panel-label">DOCUMENT MAP</div><div class="map-count">${cs.length} ${cs.length===1?'section':'sections'} · concise takeaways</div>${cs.length?cs.map((c,i)=>`<button class="map-section ${selectedChunk===i?'active':''}" data-act="select-chunk" data-index="${i}"><span class="index">${String(i+1).padStart(2,'0')}</span><span class="map-title">${esc(c.title)}</span></button>`).join(''):'<p class="stage-note" style="padding:0 10px">No extractable sections</p>'}<div class="map-divider"></div><div class="rail-tip"><b>Short by design</b>Chunks show the takeaway, not a copy of the document. The complete source lives under Original.</div></aside><section class="panel stage"><div class="tabs" role="tablist" aria-label="Document views"><button role="tab" aria-selected="${tab==='original'}" class="tab ${tab==='original'?'active':''}" data-act="tab" data-tab="original"><span class="tab-index">01</span> ${icon('file',16)} Original</button><button role="tab" aria-selected="${tab==='chunks'}" class="tab ${tab==='chunks'?'active':''}" data-act="tab" data-tab="chunks"><span class="tab-index">02</span> ${icon('layers',16)} Chunks</button><button role="tab" aria-selected="${tab==='edits'}" class="tab ${tab==='edits'?'active':''}" data-act="tab" data-tab="edits"><span class="tab-index">03</span> ${icon('edit',16)} Edits ${editDirty?'•':''}</button></div><div class="stage-inside" id="stage-body">${tab==='original'?original(root):tab==='chunks'?chunksView(cs):editView(d)}</div></section>${insight(d,cs)}</div>${footer()}</main>`}
function original(d){const e=ext(d.name),native=['pdf','png','jpg','jpeg','gif','webp','bmp'].includes(e),sourceText=['txt','text','md','markdown','csv','json','xml','rtf','html','htm'].includes(e),isPDF=e==='pdf';const note=native?'Native preview from the exact original file. No conversion or document rewriting.':sourceText?'Displaying the actual source text from the original file, without the parser’s transformations.':'Exact native Office rendering is not supported by this standalone HTML prototype. This reading preview is reconstructed; use Download exact source to open the real file in its native application.';return `<div class="section-eyebrow">01 / ORIGINAL SOURCE</div><div class="section-title"><h3>Your original document.</h3><span class="pill">${icon('shield',13)} Source never overwritten</span></div><div class="source-banner">${icon('shield',14)} <span>${esc(note)}</span></div><div class="reader-toolbar"><span class="stage-note">${esc(d.name)} · ${size(d.bytes)} · ${native?'Native file preview':sourceText?'Exact source text':'Office reading preview'}</span><button class="btn outline small" data-act="download-source">${icon('download',14)} Download exact source</button></div><div class="source-paper ${native?'binary-original':''} ${sourceText?'raw-original':''}" id="source-view">${native?'<div class="stage-note">Opening the original file…</div>':sourceText?`<pre class="raw-source" aria-label="Exact original source text">${d.fileBlob?'Loading exact original source…':esc(d.text||'')}</pre>`:`<div class="extracted-banner">${icon('layers',14)} EXTRACTED TEXT · NOT A NATIVE OFFICE RENDER · DOWNLOAD EXACT FILE ABOVE</div>${d.html||plainHtml(d.text||'')}`}</div>`}
function chunksView(cs){if(!cs.length)return `<div class="section-eyebrow">02 / DOCUMENT UNDERSTANDING</div><h3>No readable text detected</h3><p class="stage-note">This format requires OCR or a dedicated extraction adapter before a meaningful summary can be created. The original remains preserved.</p><button class="btn outline" data-act="tab" data-tab="original">Open the original ${icon('arrow',15)}</button>`;const c=cs[selectedChunk];return `<div class="section-eyebrow">02 / THE ESSENTIALS</div><div class="section-title"><h3>Just what matters.</h3><span class="pill">${cs.length} curated sections</span></div><div class="reader-toolbar"><span class="stage-note">A quick-read map created from the readable text.</span><span class="pill orange">Extractive demo</span></div><article class="chunk-head"><div class="kicker">CHUNK ${String(selectedChunk+1).padStart(2,'0')} / ${String(cs.length).padStart(2,'0')}</div><h3>${esc(c.title)}</h3><p>${esc(c.summary||'This section is present, but a reliable summary could not be extracted.')}</p></article><section class="takeaways"><div class="section-eyebrow">KEY TAKEAWAYS</div>${c.points?.length?c.points.slice(0,3).map((x,i)=>`<div class="takeaway"><span>${String(i+1).padStart(2,'0')}</span><p>${esc(x)}</p></div>`).join(''):'<p class="stage-note">No high-confidence key statements detected.</p>'}</section><div class="source-link"><span>${icon('shield',15)} ${c.words.toLocaleString()} source words · condensed for quick reading</span><button class="btn outline small" data-act="tab" data-tab="original">View complete original ${icon('arrow',14)}</button></div><div class="chunk-pagination"><button class="btn outline small" data-act="prev-chunk" ${selectedChunk===0?'disabled':''}>← Previous chunk</button><span class="stage-note">${selectedChunk+1} of ${cs.length}</span><button class="btn dark small" data-act="next-chunk" ${selectedChunk===cs.length-1?'disabled':''}>Next chunk ${icon('arrow',13)}</button></div><p class="download-note" style="margin-top:16px">Prototype uses rule-based key-statement extraction, not verified AI summarisation. Source text stays in Original.</p>`}
function editView(d){return `<div class="section-eyebrow">03 / The transformation</div><div class="section-title"><h3>Edit this version.</h3><span class="pill orange">New folder version</span></div><div class="edit-head"><div><strong>${icon('edit',15)} Working document</strong><div><span>Edit text and formatting below. Your original is preserved.</span></div></div><span id="edit-state">${editDirty?'Unsaved changes':'No changes yet'}</span></div><div class="editor-toolbar" role="toolbar" aria-label="Editor formatting"><button class="tool-button" data-format="bold" title="Bold"><b>B</b></button><button class="tool-button" data-format="italic" title="Italic"><i>I</i></button><button class="tool-button" data-format="underline" title="Underline"><u>U</u></button><span class="toolbar-sep"></span><button class="tool-button" data-format="formatBlock" data-value="h2" title="Heading">H2</button><button class="tool-button" data-format="formatBlock" data-value="p" title="Paragraph">¶</button><button class="tool-button" data-format="insertUnorderedList" title="Bulleted list">☷</button><span class="toolbar-sep"></span><button class="tool-button" data-act="undo" title="Undo">↶</button><button class="tool-button" data-act="reset" title="Restore starting version">↺</button></div><div id="editor" class="editable" contenteditable="true" role="textbox" aria-label="Editable working copy" aria-multiline="true" spellcheck="true">${editingHtml||'<p>No editable text available. Please upload a supported document.</p>'}</div><div class="edit-actions"><div><button class="btn dark" data-act="save-edit" ${!d.text?'disabled':''}>${icon('check',15)} Save as next version</button><button class="btn outline" data-act="export-edit">${icon('download',15)} Export HTML</button></div><span class="stage-note">${editDirty?'Modified working copy':'Your changes stay separate from the source'}</span></div><details class="compare-snapshot"><summary>Compare against source text</summary><pre>${esc((d.text||'').sl function insight(d,cs){const raw=d.text||'',words=raw.trim()?raw.trim().split(/\s+/).length:0;return `<aside class="panel insight-panel"><div><div class="panel-label">Document pulse</div><div class="insight-number">${String(cs.length).padStart(2,'0')}</div><div class="insight-desc">readable sections found</div></div><div class="insight-divider"></div><div><div class="panel-label">At a glance</div><div class="insight-line"><span>Words</span><b>${words.toLocaleString()}</b></div><div class="insight-line"><span>Format</span><b>${esc(typeLabel(d.name))}</b></div><div class="insight-line"><span>File size</span><b>${size(d.bytes)}</b></div><div class="insight-line"><span>Origin</span><b>${d.parentId?'Saved version':'Original upload'}</b></div><div class="insight-line"><span>Uploaded</span><b>${humanDate(d.createdAt)}</b></div></div><div class="signal-card"><b>${icon('spark',15)} A useful distinction</b>${cs.length>0?'The section map is grounded in readable source text, not an invented table of contents.':'No text layer was extracted. OCR or an appropriate parser is needed.'}</div><button class="btn muted small insight-cta" data-act="folder" data-id="${esc(rootOf(d).id)}">${icon('clock',14)} Open document folder ${icon('arrow',13)}</button></aside>`}

function historyItems(groups){return groups.length?groups.map(f=>{const d=f.root,newest=f.versions.at(-1);return `<button class="history-item folder-row" data-act="folder" data-id="${esc(d.id)}"><span class="folder-icon">${icon('layers',23)}</span><span class="folder-info"><strong>${esc(folderName(d))}</strong><small>${esc(typeLabel(d.name))} original · ${f.versions.length} version${f.versions.length===1?'':'s'} · Last change ${humanDate(newest.createdAt)}</small><span class="folder-crumbs">${f.versions.slice(-5).map((v,i)=>`<em class="mini-version ${!v.parentId?'source':''}">v${versionNumber(v)}</em>`).join('')}</span></span><span class="folder-chevron">Open folder ${icon('arrow',15)}</span></button>`}).join(''):'<div class="empty"><h3>No folders found</h3><p>Try another search or scan a new file.</p></div>'}
function folderView(){const root=docs.find(d=>d.id===folderId);if(!root)return history();const family=versionsOf(root);return `<main class="main library folder-page"><div class="crumb"><button data-act="history">Document history</button><span>/</span><strong>${esc(folderName(root))}</strong></div><section class="folder-hero"><div class="folder-header-icon">${icon('layers',33)}</div><div class="folder-header-copy"><div class="kicker">DOCUMENT FAMILY</div><h1>${esc(folderName(root))}</h1><p>${family.length} connected version${family.length===1?'':'s'} · Source uploaded ${humanDate(root.createdAt)} · ${esc(typeLabel(root.name))}</p></div><button class="btn outline" data-act="open" data-id="${esc(family.at(-1).id)}">Open latest ${icon('arrow',15)}</button></section><div class="folder-intro"><span>${icon('shield',17)} Source preserved from day one</span><span>${icon('layers',17)} ${family.length} visible versions</span><span>${icon('edit',17)} Changes become new drafts</span></div><section class="folder-versions"><div class="folder-versions-title"><h2>Version timeline</h2><p>Choose any version to inspect it, read its chunks or create the next working copy.</p></div>${family.map((v,i)=>`<div class="version-item"><div class="timeline-marker ${i===0?'source':''}">${i===0?icon('shield',19):String(i+1).padStart(2,'0')}</div><div class="version-card"><div class="version-card-main"><div class="version-card-label"><strong>v${i+1}</strong> <span class="pill ${i===0?'':'orange'}">${i===0?'Original source':'Saved draft'}</span>${i===family.length-1?'<span class="latest-label">Latest</span>':''}</div><h3>${esc(v.name)}</h3><p>${humanDate(v.createdAt)} · ${size(v.bytes)} ${i>0?'· Derived from v'+versionNumber(docs.find(x=>x.id===v.parentId)||root):'· Uploaded file · Immutable'}</p></div><button class="btn ${i===family.length-1?'dark':'outline'} small" data-act="open" data-id="${esc(v.id)}">Open v${i+1} ${icon('arrow',14)}</button></div></div>`).join('')}</section>${footer()}</main>`}

function htmlDownload(html,title){return `<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title><style>body{max-width:820px;margin:48px auto;padding:0 25px;font:16px/1.75 Georgia,serif;color:#263e32}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccd7ce;padding:8px}pre{white-space:pre-wrap}

async function saveEdit(){const d=active();if(!d||!d.text)return;captureEditor();const content=safeHtml(editingHtml||d.html);const text=plainFromHtml(content);if(!text.trim()){notify('The edited document is empty. Add some content before saving.',true);return}const family=versionsOf(rootOf(d));const n=family.length+1;const filename=folderName(rootOf(d))+' · v'+n+'.html';const output=htmlDownload(content,filename);const obj={id:id(),name:filename,type:'text/html',versionIndex:n,bytes:new Blob([output]).size,createdAt:new Date().toISOString(),text,html:content,fileBlob:new Blob([output],{type:'text/html'}),status:'Saved draft · not verified',parentId:d.id,demo:false};docs.unshift(obj);await dbPut(obj);notify(`Version v${n} saved inside ${folderName(rootOf(d))}. Original preserved.`);setView('workspace',obj.id);chooseTab('edits')}
function renderProgress(step,title){const labels=['Read original file','Extract readable content','Build document map','Prepare three views'];const modal=document.querySelector('#progress-overlay');if(!modal)return;modal.querySelector('#progress-title').textContent=title;modal.querySelector('.process-list').innerHTML=labels.map((x,i)=>`<div class="process-step ${i<step?'done':i===step?'current':''}"><i>${i<step?'✓':i===step?'●':String(i+1)}</i>${x}</div>`).join('');modal.querySelector('.progress-bar').style.width=(Math.max(3,Math.min(100,(step+1)/4*100)))+'%'}
function beginProgress(name){const e=document.createElement('div');e.className='overlay';e.id='progress-overlay';e.innerHTML=`<div class="process-modal"><div class="kicker">Scanning file</div><h2 id="progress-title">${esc(name)}</h2><p>A local preview of how Channel360 turns an upload into a navigable document experience.</p><div class="process-list"></div><div class="progress-track"><div class="progress-bar"></div></div></div>`;document.body.appendChild(e);renderProgress(0,name)}
function loadScript(url,global){return new Promise((resolve,reject)=>{if(window[global])return resolve(window[global]);const s=document.createElement('script');s.src=url;s.onload=()=>window[global]?resolve(window[global]):reject(new Error('Parser not found after load'));s.onerror=()=>reject(new Error('Library unavailable. Internet connection may be required for '+global+'.'));document.head.appendChild(s)})}
function csvRecords(text){const rows=[];let row=[],cell='',quote=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'&&text[i+1]==='"'&&quote){cell+='"';i++}else if(c==='"')quote=!quote;else if(c===','&&!quote){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}else cell+=c}if(row.length||cell){row.push(cell);rows.push(row)}return rows}
function gridHtml(rows){const head=(rows[0]||[]).slice(0,40),body=rows.slice(1,400);return `<h2>Extracted table</h2><table><thead><tr>${head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${body.map(r=>`<tr>${head.map((_,i)=>`<td>${esc(r[i]||'')}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
async function parseFile(file){const e=ext(file.name);let text='',html='',status='Parsed';if(['txt','text','md','markdown','xml','rtf'].includes(e)){text=await file.text();html=plainHtml(text)}else if(e==='json'){const raw=await file.text();try{text=JSON.stringify(JSON.parse(raw),null,2)}catch{text=raw}html=`<h2>JSON source</h2><pre>${esc(text)}</pre>`}else if(e==='csv'){const raw=await file.text();const rows=csvRecords(raw);text='# Table: '+file.name+'\n'+rows.map(r=>r.join(' | ')).join('\n');html=gridHtml(rows)}else if(['html','htm'].includes(e)){const raw=await file.text();html=safeHtml(raw);text=plainFromHtml(html)}else if(e==='docx'){const mammoth=await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.9.0/mammoth.browser.min.js','mammoth');const result=await mammoth.convertToHtml({arrayBuffer:await file.arrayBuffer()});html=safeHtml(result.value);text=plainFromHtml(html);status='Extracted · layout approximate'}else if(['xlsx','xls'].includes(e)){const X=await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js','XLSX');const wb=X.read(await file.arrayBuffer(),{type:'array'});let parts=[],htmlParts=[];for(const name of wb.SheetNames.slice(0,20)){const sheet=wb.Sheets[name];parts.push('## Sheet: '+name+'\n'+X.utils.sheet_to_csv(sheet));htmlParts.push(`<h2>${esc(name)}</h2>${safeHtml(X.utils.sheet_to_html(sheet))}`)}text=parts.join('\n\n');html=htmlParts.join('');status='Extracted · layout approximate'}else if(e==='pdf'){const pdfjs=await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','pdfjsLib');pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const pdf=await pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;const pages=[];for(let i=1;i<=Math.min(pdf.numPages,100);i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();let lastY=null,line='';const lines=[];for(const item of c.items){if(!item.str)continue;const y=item.transform?.[5];if(lastY!=null&&Math.abs(y-lastY)>3){lines.push(line.trim());line=''}line+=item.str+(item.hasEOL?'\n':' ');lastY=y}if(line.trim())lines.push(line.trim());pages.push(`## Page ${i}\n`+lines.join('\n'))}text=pages.join('\n\n');html=plainHtml(text);if(!text.replace(/## Page \d+/g,'').trim())status='Scanned PDF · OCR needed';if(pdf.numPages>100)status='First 100 pages extracted' }else if(['png','jpg','jpeg','gif','webp','bmp'].includes(e)){status='Native image · no OCR';text='';html='<p>This is an image. Its exact pixels are shown in Original; OCR is not available in this browser demo.</p>'}else if(e==='pptx'||e==='odt'){const JSZip=await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js','JSZip');const zip=await JSZip.loadAsync(await file.arrayBuffer());const paths=Object.keys(zip.files).filter(f=>e==='pptx'?/^ppt\/slides\/slide\d+\.xml$/.test(f):f==='content.xml').sort((a,b)=>{const an=Number(a.match(/slide(\d+)/)?.[1]||0),bn=Number(b.match(/slide(\d+)/)?.[1]||0);return an-bn});const pieces=[];for(let i=0;i<paths.length;i++){const xml=await zip.files[paths[i]].async('text'),dom=new DOMParser().parseFromString(xml,'application/xml');if(e==='pptx'){const texts=Array.from(dom.getElementsByTagName('*')).filter(x=>x.localName==='t').map(x=>x.textContent||'').filter(Boolean);pieces.push('## Slide '+(i+1)+'\n'+texts.join('\n'))}else{const raw=Array.from(dom.getElementsByTagName('*')).filter(x=>['p','h'].includes(x.localName)).map(x=>x.textContent||'').filter(Boolean);pieces.push('## Document text\n'+raw.join('\n'))}}text=pieces.join('\n\n');html=plainHtml(text);status='Extracted · layout approximate';if(!text.trim())status='Stored · text extraction unavailable'}else{status='Stored · parser required';text='';html='<p>Preview extraction for this file type requires a dedicated backend adapter. The original upload is preserved.</p>'}return {text,html,status}}
async function ingest(files){if(busy)return;busy=true;let successes=0;for(const file of files.slice(0,10)){if(file.size>30*1024*1024){notify(file.name+': 30 MB preview limit exceeded.',true);continue}beginProgress(file.name);try{renderProgress(0,file.name);await sleep(180);const parsed=await parseFile(file);renderProgress(1,file.name);await sleep(160);chunkify(parsed.text);renderProgress(2,file.name);await sleep(160);const obj={id:id(),name:file.name,type:file.type||'application/octet-stream',versionIndex:1,bytes:file.size,createdAt:new Date().toISOString(),text:parsed.text,html:parsed.html,fileBlob:file,status:parsed.status,parentId:null,demo:false};docs.unshift(obj);await dbPut(obj);activeId=obj.id;renderProgress(3,file.name);await sleep(220);successes++}catch(err){console.error(err);notify(`${file.name}: ${err.message||'Cannot read file'}`,true)}finally{$('progress-overlay')?.remove()}}busy=false;if(successes){setView('workspace',activeId);notify(`${successes} document${successes===1?'':'s'} added. Source preserved in browser.`)}}
async function renderBinaryIfNeeded(){
 const d=rootOf(active());const el=$('source-view');if(!d||!el||!d.fileBlob)return;

function bindDrop(){const zone=$('dropzone');if(!zone)return;zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('dragging')});zone.addEventListener('dragleave',()=>zone.classList.remove('dragging'));zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('dragging');ingest(Array.from(e.dataTransfer?.files||[]))})}
